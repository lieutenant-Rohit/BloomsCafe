spring.application.name=BloomsCafe

# Database - Primary (writes)
primary.datasource.jdbc-url=jdbc:postgresql://localhost:5432/bakery_db
primary.datasource.username=root1
primary.datasource.password=
primary.datasource.driver-class-name=org.postgresql.Driver
primary.datasource.hikari.maximum-pool-size=80

# Database - Replica (reads)
replica.datasource.jdbc-url=jdbc:postgresql://localhost:5433/bakery_db
replica.datasource.username=root1
replica.datasource.password=
replica.datasource.driver-class-name=org.postgresql.Driver
replica.datasource.hikari.maximum-pool-size=80

# Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# SQL Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# JWT
jwt.secret=wuypI6Jmnp7eAWp0SNGY4r5nMI087PuG8TO2THgm3cQ=

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
